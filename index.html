<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faris | Personal Portfolio</title>

    <!-- =========================
         GOOGLE FONT
    ========================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {

            --primary: #5b8cff;
            --primary-dark: #3d6fe8;
            --secondary: #8b5cf6;

            --background: #070b14;
            --background-2: #0d1320;

            --card: rgba(255,255,255,0.045);
            --card-hover: rgba(255,255,255,0.075);

            --text: #ffffff;
            --text-secondary: #aab3c5;

            --border: rgba(255,255,255,0.09);

            --shadow:
                0 20px 60px rgba(0,0,0,0.25);

            --radius: 20px;
        }


        body.light {

            --background: #f5f7fb;
            --background-2: #ffffff;

            --card: rgba(0,0,0,0.035);
            --card-hover: rgba(0,0,0,0.06);

            --text: #101522;
            --text-secondary: #626b7a;

            --border: rgba(0,0,0,0.09);

            --shadow:
                0 20px 60px rgba(0,0,0,0.08);
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            font-family: "Poppins", sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(91,140,255,0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(139,92,246,0.08),
                    transparent 30%
                ),
                var(--background);

            color: var(--text);

            overflow-x: hidden;

            transition:
                background 0.4s,
                color 0.4s;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        button,
        input,
        textarea {
            font-family: inherit;
        }


        img {
            display: block;
            max-width: 100%;
        }


        .container {

            width: min(1150px, 90%);

            margin: auto;
        }


        /* =====================================================
           LOADING SCREEN
        ===================================================== */

        #loader {

            position: fixed;

            inset: 0;

            z-index: 9999;

            background: var(--background);

            display: flex;

            justify-content: center;

            align-items: center;

            transition: opacity 0.5s,
                        visibility 0.5s;
        }


        #loader.hide {

            opacity: 0;

            visibility: hidden;
        }


        .loader-circle {

            width: 55px;

            height: 55px;

            border-radius: 50%;

            border: 4px solid rgba(255,255,255,0.1);

            border-top-color: var(--primary);

            animation:
                spin 1s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
           PARTICLE BACKGROUND
        ===================================================== */

        #particles {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -1;

            overflow: hidden;
        }


        .particle {

            position: absolute;

            width: 3px;

            height: 3px;

            background: var(--primary);

            border-radius: 50%;

            opacity: 0.3;

            animation:
                floatParticle linear infinite;
        }


        @keyframes floatParticle {

            from {

                transform:
                    translateY(100vh);

                opacity: 0;
            }

            20% {

                opacity: 0.3;
            }

            80% {

                opacity: 0.3;
            }

            to {

                transform:
                    translateY(-100px);

                opacity: 0;
            }
        }


        /* =====================================================
           NAVBAR
        ===================================================== */

        header {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            z-index: 1000;

            background:
                rgba(7,11,20,0.7);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid transparent;

            transition: 0.3s;
        }


        body.light header {

            background:
                rgba(255,255,255,0.75);
        }


        header.scrolled {

            border-bottom-color:
                var(--border);
        }


        .navbar {

            height: 75px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {

            font-size: 25px;

            font-weight: 800;

            letter-spacing: -1px;
        }


        .logo span {

            color: var(--primary);
        }


        .nav-menu {

            display: flex;

            align-items: center;

            gap: 28px;
        }


        .nav-menu a {

            color: var(--text-secondary);

            font-size: 14px;

            font-weight: 500;

            transition: 0.3s;

            position: relative;
        }


        .nav-menu a::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -7px;

            width: 0;

            height: 2px;

            background: var(--primary);

            transition: 0.3s;
        }


        .nav-menu a:hover {

            color: var(--text);
        }


        .nav-menu a:hover::after {

            width: 100%;
        }


        .nav-actions {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .icon-btn {

            width: 40px;

            height: 40px;

            border-radius: 50%;

            border: 1px solid var(--border);

            background: var(--card);

            color: var(--text);

            cursor: pointer;

            transition: 0.3s;
        }


        .icon-btn:hover {

            border-color: var(--primary);

            color: var(--primary);

            transform: translateY(-2px);
        }


        .menu-toggle {

            display: none;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            min-height: 100vh;

            display: flex;

            align-items: center;

            padding-top: 100px;

            position: relative;
        }


        .hero-grid {

            display: grid;

            grid-template-columns:
                1.1fr 0.9fr;

            align-items: center;

            gap: 60px;
        }


        .badge {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 14px;

            border-radius: 50px;

            background:
                rgba(91,140,255,0.1);

            border:
                1px solid
                rgba(91,140,255,0.2);

            color: var(--primary);

            font-size: 13px;

            margin-bottom: 20px;
        }


        .status-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: #4ade80;

            box-shadow:
                0 0 10px #4ade80;
        }


        .hero h1 {

            font-size:
                clamp(45px, 7vw, 78px);

            line-height: 1.05;

            letter-spacing: -3px;

            margin-bottom: 15px;
        }


        .gradient-text {

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }


        .typing-wrapper {

            font-size: 21px;

            color: var(--text-secondary);

            min-height: 35px;

            margin-bottom: 20px;
        }


        .typing {

            color: var(--primary);
        }


        .cursor {

            color: var(--primary);

            animation:
                blink 0.8s infinite;
        }


        @keyframes blink {

            50% {
                opacity: 0;
            }
        }


        .hero-description {

            max-width: 620px;

            color: var(--text-secondary);

            font-size: 15px;

            line-height: 1.9;

            margin-bottom: 30px;
        }


        .hero-buttons {

            display: flex;

            flex-wrap: wrap;

            gap: 12px;
        }


        .btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 13px 22px;

            border-radius: 12px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.3s;

            cursor: pointer;

            border: 1px solid transparent;
        }


        .btn-primary {

            background: var(--primary);

            color: white;

            box-shadow:
                0 10px 30px
                rgba(91,140,255,0.2);
        }


        .btn-primary:hover {

            background: var(--primary-dark);

            transform:
                translateY(-3px);
        }


        .btn-outline {

            border-color: var(--border);

            background: var(--card);

            color: var(--text);
        }


        .btn-outline:hover {

            border-color: var(--primary);

            color: var(--primary);

            transform:
                translateY(-3px);
        }


        /* =====================================================
           HERO PROFILE
        ===================================================== */

        .hero-profile {

            display: flex;

            justify-content: center;

            position: relative;
        }


        .profile-wrapper {

            width: 350px;

            height: 350px;

            position: relative;
        }


        .profile-ring {

            position: absolute;

            inset: 0;

            border-radius: 50%;

            background:
                conic-gradient(
                    var(--primary),
                    var(--secondary),
                    var(--primary)
                );

            animation:
                rotateRing 8s linear infinite;
        }


        @keyframes rotateRing {

            to {
                transform: rotate(360deg);
            }
        }


        .profile-inner {

            position: absolute;

            inset: 7px;

            border-radius: 50%;

            background: var(--background);

            padding: 8px;
        }


        .profile-inner img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            background: var(--card);
        }


        .floating-card {

            position: absolute;

            padding: 13px 17px;

            background:
                rgba(20,28,45,0.85);

            backdrop-filter: blur(15px);

            border:
                1px solid var(--border);

            border-radius: 13px;

            box-shadow: var(--shadow);

            font-size: 12px;

            animation:
                floating 4s ease-in-out infinite;
        }


        body.light .floating-card {

            background:
                rgba(255,255,255,0.85);
        }


        .floating-card strong {

            display: block;

            font-size: 14px;

            margin-bottom: 2px;
        }


        .card-one {

            left: -35px;

            bottom: 50px;
        }


        .card-two {

            right: -25px;

            top: 40px;

            animation-delay: 1s;
        }


        @keyframes floating {

            0%,100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-12px);
            }
        }


        /* =====================================================
           GENERAL SECTION
        ===================================================== */

        section {

            padding: 110px 0;
        }


        .section-header {

            text-align: center;

            max-width: 650px;

            margin:
                0 auto 60px;
        }


        .section-label {

            color: var(--primary);

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 10px;
        }


        .section-title {

            font-size:
                clamp(30px,5vw,42px);

            line-height: 1.2;

            margin-bottom: 12px;
        }


        .section-description {

            color: var(--text-secondary);

            font-size: 14px;
        }


        /* =====================================================
           ABOUT
        ===================================================== */

        .about-grid {

            display: grid;

            grid-template-columns:
                0.9fr 1.1fr;

            gap: 30px;
        }


        .glass-card {

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius:
                var(--radius);

            padding: 30px;

            box-shadow:
                var(--shadow);

            transition: 0.3s;
        }


        .glass-card:hover {

            transform:
                translateY(-5px);

            background:
                var(--card-hover);
        }


        .about-card h3 {

            font-size: 22px;

            margin-bottom: 15px;
        }


        .about-card p {

            color: var(--text-secondary);

            font-size: 14px;

            line-height: 1.9;
        }


        .bio-grid {

            display: grid;

            grid-template-columns:
                repeat(2,1fr);

            gap: 18px;

            margin-top: 25px;
        }


        .bio-box {

            padding: 16px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,0.02);
        }


        .bio-box small {

            color: var(--text-secondary);

            display: block;

            margin-bottom: 4px;
        }


        .bio-box strong {

            font-size: 14px;
        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            gap: 18px;

            margin-top: 30px;
        }


        .stat {

            text-align: center;

            padding: 25px;

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 16px;
        }


        .stat-number {

            font-size: 30px;

            font-weight: 800;

            color: var(--primary);

            margin-bottom: 5px;
        }


        .stat-label {

            color: var(--text-secondary);

            font-size: 12px;
        }


        /* =====================================================
           EDUCATION
        ===================================================== */

        .timeline {

            max-width: 850px;

            margin: auto;

            position: relative;
        }


        .timeline::before {

            content: "";

            position: absolute;

            left: 20px;

            top: 0;

            bottom: 0;

            width: 2px;

            background:
                linear-gradient(
                    var(--primary),
                    transparent
                );
        }


        .timeline-item {

            position: relative;

            padding-left: 65px;

            margin-bottom: 35px;
        }


        .timeline-dot {

            position: absolute;

            left: 10px;

            top: 8px;

            width: 22px;

            height: 22px;

            border-radius: 50%;

            background: var(--primary);

            border:
                5px solid var(--background);

            box-shadow:
                0 0 0 2px var(--primary);
        }


        .timeline-card {

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 17px;

            padding: 25px;

            transition: 0.3s;
        }


        .timeline-card:hover {

            transform:
                translateX(5px);

            border-color:
                var(--primary);
        }


        .timeline-year {

            color: var(--primary);

            font-size: 12px;

            font-weight: 600;
        }


        .timeline-card h3 {

            margin: 5px 0;

            font-size: 19px;
        }


        .timeline-card p {

            color: var(--text-secondary);

            font-size: 13px;

            line-height: 1.8;
        }


        /* =====================================================
           INTERESTS
        ===================================================== */

        .cards-grid {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 20px;
        }


        .interest-card {

            padding: 30px;

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 18px;

            transition: 0.3s;
        }


        .interest-card:hover {

            transform:
                translateY(-8px);

            border-color:
                var(--primary);
        }


        .interest-icon {

            width: 55px;

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 14px;

            background:
                rgba(91,140,255,0.1);

            font-size: 25px;

            margin-bottom: 20px;
        }


        .interest-card h3 {

            margin-bottom: 10px;
        }


        .interest-card p {

            color: var(--text-secondary);

            font-size: 13px;

            line-height: 1.8;
        }


        /* =====================================================
           SKILLS
